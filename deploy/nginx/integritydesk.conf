# IntegrityDesk nginx site config (template)
# Placeholders: @APP_DOMAIN@, @DASHBOARD_PORT@, @BACKEND_PORT@
#
# This is the HTTP base block. deploy/setup.sh runs `certbot --nginx`
# which upgrades it to TLS and adds the 443 + redirect blocks automatically.

server {
    listen 80;
    listen [::]:80;
    server_name @APP_DOMAIN@;

    client_max_body_size 500M;

    # API requests -> FastAPI backend (direct, avoids double-proxy for SSE/uploads)
    location /api/ {
        proxy_pass http://127.0.0.1:@BACKEND_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Report downloads
    location /report/ {
        proxy_pass http://127.0.0.1:@BACKEND_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend docs (FastAPI /docs, /redoc, /openapi.json)
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://127.0.0.1:@BACKEND_PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Next.js dashboard
    location / {
        proxy_pass http://127.0.0.1:@DASHBOARD_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
