# IntegrityDesk Apache vhost config (template)
# Placeholders: @APP_DOMAIN@, @DASHBOARD_PORT@, @BACKEND_PORT@
#
# This is the HTTP base block. deploy/setup.sh runs `certbot --apache`
# which upgrades it to TLS and adds the 443 + redirect blocks automatically.
#
# Requires: a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl

<VirtualHost *:80>
    ServerName @APP_DOMAIN@

    # Large file uploads
    LimitRequestBody 524288000

    # --- API -> FastAPI backend (direct, avoids double-proxy for SSE/uploads) ---
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:@BACKEND_PORT@/api/ flushpackets=on
    ProxyPassReverse /api/ http://127.0.0.1:@BACKEND_PORT@/api/

    # Report downloads
    ProxyPass /report/ http://127.0.0.1:@BACKEND_PORT@/report/ flushpackets=on
    ProxyPassReverse /report/ http://127.0.0.1:@BACKEND_PORT@/report/

    # Backend docs (FastAPI /docs, /redoc, /openapi.json)
    ProxyPass /docs http://127.0.0.1:@BACKEND_PORT@/docs
    ProxyPassReverse /docs http://127.0.0.1:@BACKEND_PORT@/docs
    ProxyPass /redoc http://127.0.0.1:@BACKEND_PORT@/redoc
    ProxyPassReverse /redoc http://127.0.0.1:@BACKEND_PORT@/redoc
    ProxyPass /openapi.json http://127.0.0.1:@BACKEND_PORT@/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:@BACKEND_PORT@/openapi.json

    # Everything else -> Next.js dashboard
    ProxyPass / http://127.0.0.1:@DASHBOARD_PORT@/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:@DASHBOARD_PORT@/

    # Pass the real client info through
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog ${APACHE_LOG_DIR}/integritydesk-error.log
    CustomLog ${APACHE_LOG_DIR}/integritydesk-access.log combined
</VirtualHost>
