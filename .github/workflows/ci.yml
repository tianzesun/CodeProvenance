name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Fake connection strings so backend settings import in CI without .env.local.
  DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_db"
  REDIS_URL: "redis://localhost:6379/0"
  EMBEDDING_SERVER_URL: "http://localhost:8001"
  BACKEND_URL: "http://localhost:8000"
  NEXT_PUBLIC_API_URL: "http://localhost:8000"

jobs:
  migrations:
    name: "Migrations (fresh Postgres: upgrade, rollback, re-apply)"
    runs-on: ubuntu-latest
    # Catches the failure classes that hit this repo in August 2026: a
    # duplicate revision id (alembic cannot even load the script directory),
    # from-scratch breakage (migrations referencing tables no migration
    # creates), and non-idempotent migrations colliding with drifted schemas.
    # The workflow-level DATABASE_URL points at this service.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Full chain applies from scratch
        run: python -m alembic upgrade head

      - name: Head revision rolls back and re-applies
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit test suite
        run: |
          python -m pytest tests/unit/ -q -o addopts="-v --tb=short --strict-markers --disable-warnings"

  frontend-build:
    name: Frontend TypeScript + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  lint-format:
    name: Python Lint + Format (ruff/black)
    runs-on: ubuntu-latest
    # TODO(phase-0 cleanup): clear the 935 pre-existing ruff findings across
    # src/backend, then set continue-on-error to false to make this a merge gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff
        run: ruff check src/backend --output-format=concise

      - name: Run ruff format check
        run: ruff format --check src/backend

      - name: Run black check
        run: black --check src/backend

  frontend-lint:
    name: Frontend Lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    # TODO(phase-0 cleanup): clear the 41 pre-existing errors (no-explicit-any,
    # react/no-unescaped-entities), then set continue-on-error to false.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        run: npm run lint