name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Fake connection strings so backend settings import in CI without .env.local.
  DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_db"
  REDIS_URL: "redis://localhost:6379/0"
  EMBEDDING_SERVER_URL: "http://localhost:8001"
  BACKEND_URL: "http://localhost:8000"
  NEXT_PUBLIC_API_URL: "http://localhost:8000"

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit test suite
        run: |
          python -m pytest tests/unit/ -q -o addopts="-v --tb=short --strict-markers --disable-warnings"

  frontend-build:
    name: Frontend TypeScript + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  lint-format:
    name: Python Lint + Format (ruff/black)
    runs-on: ubuntu-latest
    # TODO(phase-0 cleanup): clear the 935 pre-existing ruff findings across
    # src/backend, then set continue-on-error to false to make this a merge gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff
        run: ruff check src/backend --output-format=concise

      - name: Run ruff format check
        run: ruff format --check src/backend

      - name: Run black check
        run: black --check src/backend

  frontend-lint:
    name: Frontend Lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    # TODO(phase-0 cleanup): clear the 41 pre-existing errors (no-explicit-any,
    # react/no-unescaped-entities), then set continue-on-error to false.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        run: npm run lint