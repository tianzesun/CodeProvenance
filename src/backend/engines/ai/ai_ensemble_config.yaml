# AI-generated code detection module configuration.
#
# Controls the ensemble scorer weights, the severity thresholds, and the
# classification switch. Weights follow the same pattern as engine_weights.yaml
# used for the similarity engines — all values are hot-loadable (the file is
# re-read when it changes; no restart or explicit reload needed).
#
# Weights should sum to 1.0 within each scoring mode (they are normalised over
# the signals that are present, so a missing signal does not break the score).
# Invalid sections (non-numeric weights, negative values, wrong types) are
# ignored with a warning and replaced by the built-in defaults.
ensemble:
  # Scoring modes: 'heuristic' (no trained model available) or 'ml'
  # (trained classifier present). The scorer auto-selects.
  heuristic:
    ast: 0.20
    stylometry: 0.25
    perplexity: 0.25
    burstiness: 0.15
    pattern_library: 0.15
  ml:
    classifier: 0.45
    ast: 0.15
    stylometry: 0.15
    perplexity: 0.15
    burstiness: 0.10

thresholds:
  # ai_probability cutoffs, aligned with _ai_bucket in server.py
  medium_risk: 0.40
  high_risk: 0.70
  # Below this probability, results are labelled "possibly refactored AI code"
  # rather than a hard binary, to handle heavily edited/paraphrased AI code.
  refactor_selection: 0.35

classification:
  # Trained on AIGCodeSet (2,795 AI + 4,541 human Python samples) and saved
  # under src/backend/engines/ai/models/. Grouped-holdout AUC ~0.66 vs ~0.52
  # for the heuristic on unseen problems — a real but modest improvement.
  #
  # RETRAIN AFTER EXTRACTOR CHANGES. Models carry a feature-schema version and
  # the perplexity model their training features came from. A model trained
  # under an older schema is refused at load time (the ensemble then uses the
  # heuristic path; status "unavailable"), and one trained with a different
  # perplexity model than the one scoring the code is ignored (status
  # "feature_mismatch"). Retrain with:
  #   python -m src.backend.engines.ai.train_classifier <dataset> --refit-all
  # (AICODE_ALLOW_STALE_MODEL=1 overrides the schema check deliberately.)
  #
  # Enabled via the safe-blend fusion (2026-08-21): the orchestrator no longer
  # trusts the classifier outright. Its weight is gated by code length and the
  # fused score is capped below high-risk when the classifier disagrees with
  # the explainable signals, which keeps
  # tests/unit/test_ai_detector_orchestrator_precision.py green.
  enabled: true
  # Fallback model dir override (optional)
  model_dir: null

perplexity:
  window_lines: 25
  overlap_lines: 5
  # Optional: name of a locally cached, CAUSAL code LM (e.g.
  # microsoft/CodeGPT-small-py) to prefer transformer-based perplexity. Must
  # have a trained LM head; encoder-only models like microsoft/codebert-base
  # yield meaningless perplexity. Falls back to the statistical model when the
  # checkpoint is not in the local HuggingFace cache (no network download is
  # ever attempted).
  #
  # Default-on since 2026-08-21: AI detection now runs as a background job
  # (/api/ai-detect returns immediately; the upload flow offloads scoring off
  # the event loop) and loaded models are cached process-wide, so the ~6s/sample
  # cost and the ~17s one-time load no longer stall requests. Measured signal:
  # AUC 0.630 with the code LM vs 0.545 statistical (500-sample grouped fold).
  huggingface_model: "microsoft/CodeGPT-small-py"

# False-positive safeguards applied to the fused score (orchestrator path).
safeguards:
  # Signal variance above this reduces confidence. Variance of [0, 1] signals
  # cannot exceed 0.25, so a value >= 0.25 disables the check.
  variance_threshold: 0.10
  # Below this confidence a high score is capped (an uncertain call must not
  # look like a confident one) ...
  low_confidence_floor: 0.20
  # ... at this probability, just under the 0.70 high-risk threshold.
  low_confidence_cap: 0.66

# Safe-blend fusion: how the orchestrator combines the trained classifier with
# the explainable heuristic signals. The classifier's weight grows with code
# length (its features misfire on short files), and when it calls AI while the
# explainable signals call human, the fused score is capped below the 0.70
# high-risk threshold instead of convicting on the classifier alone.
orchestrator:
  # Classifier weight (vs heuristic) once the file is at/above ml_full_lines.
  ml_base_weight: 0.50
  # At/below this line count the classifier gets only 20% of its base weight
  # (its features misfire on short student code).
  ml_min_lines: 25
  # At/above this line count the classifier carries its full base weight.
  ml_full_lines: 60
  # |ml - heuristic| beyond which the scores count as disagreeing.
  disagreement_gap: 0.35
  # Upper bound for the fused score when the classifier is far ABOVE the
  # heuristic score (the false-positive direction). Disagreement in the other
  # direction is never capped — heuristic fingerprints carry their own
  # precision guards.
  disagreement_cap: 0.65