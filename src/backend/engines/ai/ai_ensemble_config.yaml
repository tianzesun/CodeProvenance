# AI-generated code detection module configuration.
#
# Controls the ensemble scorer weights, the severity thresholds, and the
# classification switch. Weights follow the same pattern as engine_weights.yaml
# used for the similarity engines — all values are hot-loadable.
#
# Weights sum to 1.0 within each scoring mode.
ensemble:
  # Scoring modes: 'heuristic' (no trained model available) or 'ml'
  # (trained classifier present). The scorer auto-selects.
  heuristic:
    ast: 0.20
    stylometry: 0.25
    perplexity: 0.25
    burstiness: 0.15
    pattern_library: 0.15
  ml:
    classifier: 0.45
    ast: 0.15
    stylometry: 0.15
    perplexity: 0.15
    burstiness: 0.10

thresholds:
  # ai_probability cutoffs, aligned with _ai_bucket in server.py
  medium_risk: 0.40
  high_risk: 0.70
  # Below this probability, results are labelled "possibly refactored AI code"
  # rather than a hard binary, to handle heavily edited/paraphrased AI code.
  refactor_selection: 0.35

classification:
  # Trained on AIGCodeSet (2,795 AI + 4,541 human Python samples) and saved
  # under src/backend/engines/ai/models/. Grouped-holdout AUC ~0.66 vs ~0.52
  # for the heuristic on unseen problems — a real but modest improvement.
  #
  # Enabled via the safe-blend fusion (2026-08-21): the orchestrator no longer
  # trusts the classifier outright. Its weight is gated by code length and the
  # fused score is capped below high-risk when the classifier disagrees with
  # the explainable signals, which keeps
  # tests/unit/test_ai_detector_orchestrator_precision.py green.
  enabled: true
  # Fallback model dir override (optional)
  model_dir: null

perplexity:
  window_lines: 25
  overlap_lines: 5
  # Optional: name of a locally cached, CAUSAL code LM (e.g.
  # microsoft/CodeGPT-small-py) to prefer transformer-based perplexity. Must
  # have a trained LM head; encoder-only models like microsoft/codebert-base
  # yield meaningless perplexity. Leave empty for the statistical model.
  #
  # Latency note (measured on CPU, 2026-08-14): with the code LM enabled each
  # score costs ~6s (statistical is near-instant) plus a ~17s one-time model
  # load, and /api/ai-detect scores every uploaded file synchronously. A 20-file
  # submission would wait ~2 minutes. Off by default for that reason; enable
  # explicitly (set huggingface_model or the AICODE_TRANSFORMER_MODEL env var)
  # when latency is acceptable or AI detection runs as a background job.
  huggingface_model: ""

# Safe-blend fusion: how the orchestrator combines the trained classifier with
# the explainable heuristic signals. The classifier's weight grows with code
# length (its features misfire on short files), and when it calls AI while the
# explainable signals call human, the fused score is capped below the 0.70
# high-risk threshold instead of convicting on the classifier alone.
orchestrator:
  # Classifier weight (vs heuristic) once the file is at/above ml_full_lines.
  ml_base_weight: 0.50
  # At/below this line count the classifier gets only 20% of its base weight
  # (its features misfire on short student code).
  ml_min_lines: 25
  # At/above this line count the classifier carries its full base weight.
  ml_full_lines: 60
  # |ml - heuristic| beyond which the scores count as disagreeing.
  disagreement_gap: 0.35
  # Upper bound for the fused score when the classifier is far ABOVE the
  # heuristic score (the false-positive direction). Disagreement in the other
  # direction is never capped — heuristic fingerprints carry their own
  # precision guards.
  disagreement_cap: 0.65