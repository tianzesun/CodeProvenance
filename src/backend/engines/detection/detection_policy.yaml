# Detection Policy Configuration (v3)
#
# These are the thresholds the Evidence Hierarchy Engine ACTUALLY uses; the report prints exactly
# these values. (v1/v2 listed L1/L2/L3 tree thresholds that no code applied.)
#
# Decision rules, in order (first match wins):
#   0. identity           files identical                                         -> TRUE
#   1. strong_structural  one structural engine  >= structural_hard_match        -> TRUE
#   2. corroborated       structural >= structural_strong AND at least
#                         min_agreeing_engines engines >= structural_agree_min    -> TRUE
#                         (otherwise, one engine alone)                           -> PROBABLE
#   3. semantic support   semantic >= semantic_dominance AND structural >= medium -> PROBABLE
#   4. medium structural  structural >= structural_medium AND graph >= statistical_strong -> PROBABLE
#   5. semantic only      semantic >= semantic_flag, structural < medium          -> FLAG
#   6. conflict           |structural - semantic| > conflict_gap (both measured)  -> REVIEW
#   7. borderline         baseline-corrected structural/graph >= borderline       -> REVIEW
#   8. otherwise                                                                  -> CLEAN
#
# Semantic = embedding after baseline correction. Style similarity never counts.

ehe:
  structural_hard_match: 0.90
  structural_strong: 0.75
  structural_agree_min: 0.60
  min_agreeing_engines: 2      # set to 1 to restore the old single-engine TRUE at 0.75
  structural_medium: 0.50
  statistical_strong: 0.70
  semantic_dominance: 0.95
  semantic_flag: 0.85
  semantic_cap: 0.99
  conflict_gap: 0.50
  borderline: 0.30
  review_enabled: true

# Per-domain overrides, applied on top of ``ehe`` for that course type. Omit a domain to use the
# built-in preset; list a domain to replace it. (Keys restated under ``ehe`` apply to EVERY domain.)
domains:
  essay: {semantic_flag: 0.75, semantic_dominance: 0.90, structural_strong: 0.70}
  math: {structural_strong: 0.70, statistical_strong: 0.65}

# Noise floor of unrelated files in the same language (per engine). ``embedding`` is the
# semantic baseline; the others are used for the borderline tier.
baselines:
  token: 0.12
  winnowing: 0.16
  ast: 0.25
  ngram: 0.10
  graph: 0.20
  logic_flow: 0.20
  embedding: 0.70
  static_rules: 0.20

# DISPLAY ONLY: scale the displayed layer-1 value for course types. They never change a verdict.
display_weights:
  cs_code_ast_weight: 1.2
  essay_semantic_weight: 1.5
  math_structure_weight: 1.3
